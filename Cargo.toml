# Package metadata for mpverus.
#
# NOTE: Verus is the compiler here -- it both verifies and, with `--compile`,
# emits a binary. `cargo build` is only a convenience for editor tooling
# (rust-analyzer): the `[dependencies]`/`[workspace]` blocks below point at the
# `vstd`, `builtin`, `builtin_macros` and `state_machines_macros` sources that
# ship inside the vendored Verus toolchain, so rustc can expand `verus!` and
# resolve `vstd::` in ghost-erased mode. That needs the toolchain present at
# tools/verus-arm64-macos (it is gitignored; see README.md). Ghost-only items
# (`spec fn`, `proof fn`) are erased by that expansion, so a handful of
# cross-module imports of spec functions still show up as cargo errors --
# they are artefacts of erasure, not real breakage. Verification itself is
# unaffected: only ./verify.sh speaks for correctness.
#
#     ./verify.sh              # verify everything
#     ./verify.sh --run        # verify, compile, and run the demo
#
# This file exists so the repository is a well-formed package: it fixes the
# name, version, licence and layout, and lets `cargo metadata` and tooling
# describe the project.
[package]
name = "mpverus"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Civl-style verification of message-passing Rust protocols in Verus: ownership-derived mover types, layered refinement, and provenance."
repository = "https://github.com/rupakm/mpverus"
readme = "README.md"
keywords = ["verification", "verus", "distributed-systems", "concurrency"]
categories = ["development-tools"]
publish = false

[[bin]]
name = "mpverus"
path = "src/main.rs"

# rust-analyzer / cargo shim only -- see the note at the top of this file.
[dependencies]
vstd = { path = "tools/verus-arm64-macos/vstd" }
verus_builtin = { path = "tools/verus-arm64-macos/builtin" }
verus_builtin_macros = { path = "tools/verus-arm64-macos/builtin_macros" }
verus_state_machines_macros = { path = "tools/verus-arm64-macos/state_machines_macros" }

# The vendored crates inherit `workspace.dependencies`/`workspace.lints` from
# the Verus workspace they were built in, so this repo has to stand in as that
# workspace root for them.
[workspace]
members = ["tools/verus-arm64-macos/builtin", "tools/verus-arm64-macos/builtin_macros", "tools/verus-arm64-macos/state_machines_macros", "tools/verus-arm64-macos/vstd"]

[workspace.lints]

[workspace.dependencies]
convert_case = "0.6"
proc-macro2 = "1"
quote = "1"
synstructure = "0.13"
syn = { version = "2", features = ["full", "visit", "visit-mut", "extra-traits"] }
verus_syn = "=0.0.0-2026-08-02-0125"
verus_prettyplease = "=0.0.0-2026-08-09-0044"
indexmap = "2"
